name: Build-Android

on:
  push:
    branches: [ "Mikkelet-patch-1" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "corretto"
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.32.5

      - name: Clone repository
        uses: actions/checkout@v5

      - name: Download key files
        env:
          KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_FILE }}
          KEYSTORE_PROPS: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          pwd
          echo $RUNNER_TEMP
          KEYSTORE_PATH=./android/key.jks
          PROPERTIES_PATH=./android/key.properties
          echo "$KEYSTORE_FILE" | base64 -d > $KEYSTORE_PATH
          echo "$KEYSTORE_PROPS" | base64 -d > $PROPERTIES_PATH

      - name: Install dependencies
        run: |
          flutter pub get

      - name: build appbundle
        run: |
          flutter build appbundle --release

      - id: upload-google
        name: Upload Google Play Console
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          packageName: com.mikkelthygesen.splitsby
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
