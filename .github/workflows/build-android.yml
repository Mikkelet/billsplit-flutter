name: Build-Android

on:
  push:
    branches: [ "Mikkelet-patch-1" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "corretto"
          java-version: '21'

      - name: Download key files
        env:
          KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_FILE }}
          KEYSTORE_PROPS: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          KEYSTORE_PATH=$RUNNER_TEMP/android/key.jks
          PROPERTIES_PATH=$RUNNER_TEMP/android/key.properties
          echo "$KEYSTORE_FILE" | base64 -d > $KEYSTORE_PATH
          echo "$KEYSTORE_PROPS" | base64 -d > $PROPERTIES_PATH

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.32.5

      - name: Clone repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          flutter pub get

      - name: build apk
        run: |
          flutter build appbundle --release