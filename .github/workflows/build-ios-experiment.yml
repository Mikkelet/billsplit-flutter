name: Install certificate

on:
  push:
    branches: [ "devops/install-cert" ]

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Clone repository
        uses: actions/checkout@v5

      - name: xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app
          /usr/bin/xcodebuild -version

      - name: Install the Apple certificate and provisioning profile
        env:
          CERTIFICATE: ${{ secrets.CERTIFICATE_P12_31_01_2027 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          # create variables
          KEYCHAIN_PASSWORD=abc123
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          
          # import certificate and provisioning profile from secrets
          echo -n "$CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH
          
          # openssl pkcs12 -in $CERTIFICATE_PATH -nokeys -passin pass:$P12_PASSWORD | openssl x509 -sha1 -noout -fingerprint -subject -dates -nameopt utf8,sep_semi_plus_space
          
          security create-keychain -p $KEYCHAIN_PASSWORD $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p $KEYCHAIN_PASSWORD $KEYCHAIN_PATH
          
          # import certificate to keychain
          sh .github/workflows/scripts/install_ios_cert.sh $P12_PASSWORD $KEYCHAIN_PATH $KEYCHAIN_PASSWORD
          
          
