name: Install certificate

on:
  push:
    branches: [ "devops/install-cert" ]

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Clone repository
        uses: actions/checkout@v5

      - name: xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app
          /usr/bin/xcodebuild -version

      - name: Install the Apple certificate and provisioning profile
        env:
          CERTIFICATE: ${{ secrets.CERTIFICATE_P12_31_01_2027 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          sh .github/workflows/scripts/decode_cert.sh $CERTIFICATE $CERTIFICATE_PATH
          #echo -n "$CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH
          sh .github/workflows/scripts/install_ios_cert.sh $P12_PASSWORD $CERTIFICATE_PATH
          
          
