name: billsplit_flutter
description: A new expense sharing experience
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.3

environment:
  sdk: ^3.8.0
dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.1.0
  firebase_auth: ^6.1.4
  firebase_storage: ^13.0.1
  firebase_messaging: ^16.0.1
  firebase_crashlytics: ^5.0.7
  flutter_bloc: ^9.1.1
  http: ^1.1.0
  drift: ^2.6.0
  sqlite3_flutter_libs: ^0.5.23
  path_provider: ^2.0.0
  path: ^1.8.2
  storage_inspector: ^0.4.0
  rxdart: ^0.28.0
  collection:
  get_it: ^9.2.0
  intl: ^0.20.2
  email_validator:
  cached_network_image: ^3.2.3
  cupertino_will_pop_scope: ^1.2.1
  flutter_local_notifications: ^20.0.0
  shared_preferences: ^2.1.0
  eraser: ^3.0.0
  camera: ^0.11.1 
  flutter_animate: ^4.1.1+1
  package_info_plus: ^9.0.0
  uuid: ^4.1.0
  json_pretty: ^1.0.4
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  country_code_picker: ^3.0.0
  image_cropper: ^11.0.0
  google_mlkit_text_recognition: ^0.15.0
  phone_numbers_parser: ^9.0.11
  dio: ^5.9.0
  image_picker: ^1.2.1
  go_router: ^17.0.1
  retrofit: ^4.9.1
  json_annotation: ^4.9.0
  freezed_annotation: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.9.5
  freezed: ^3.0.6
  retrofit_generator: ^10.2.1
  build_runner: ^2.5.2
  flutter_gen_runner: ^5.11.0
  drift_dev: ^2.28.0
  go_router_builder: ^4.1.0

dependency_overrides:
  analyzer: 8.2.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/splitsby_logo.jpg
  fonts:
    - family: Montserrat
      fonts:
        - asset: fonts/Montserrat-Regular.ttf
          style: normal
        - asset: fonts/Montserrat-Light.ttf
          weight: 200
        - asset: fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: fonts/Montserrat-Italic.ttf
          style: italic
flutter_gen:
  output: lib/_generated/assets/
  integrations:
    flutter_svg: true